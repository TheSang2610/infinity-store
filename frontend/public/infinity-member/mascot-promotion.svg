<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" fill="none">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#034da2" />
    </linearGradient>
    <linearGradient id="gold-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0071e3" flood-opacity="0.28" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="160" cy="120" r="90" fill="#e0f2fe" opacity="0.6" />

  <!-- Floating Sparkles -->
  <path d="M50 70 L53 78 L61 81 L53 84 L50 92 L47 84 L39 81 L47 78 Z" fill="#38bdf8" opacity="0.8" />
  <path d="M270 50 L272 56 L278 58 L272 60 L270 66 L268 60 L262 58 L268 56 Z" fill="#60a5fa" opacity="0.85" />
  <circle cx="285" cy="140" r="5" fill="#f59e0b" opacity="0.7" />
  <circle cx="42" cy="150" r="4" fill="#0071e3" opacity="0.6" />

  <!-- Floating Voucher 1 (Top Left, tilted) -->
  <g transform="rotate(-12 90 60)">
    <rect x="55" y="42" width="78" height="44" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5" />
    <circle cx="55" cy="64" r="6" fill="#e0f2fe" />
    <circle cx="133" cy="64" r="6" fill="#e0f2fe" />
    <text x="94" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0071e3" text-anchor="middle">-30%</text>
    <text x="94" y="75" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">VOUCHER</text>
  </g>

  <!-- Floating Voucher 2 (Right, tilted) -->
  <g transform="rotate(10 230 75)">
    <rect x="195" y="55" width="82" height="44" rx="8" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="195" cy="77" r="6" fill="#fef9c3" />
    <circle cx="277" cy="77" r="6" fill="#fef9c3" />
    <text x="236" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d97706" text-anchor="middle">500.000₫</text>
    <text x="236" y="88" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#a16207" text-anchor="middle">SINH NHẬT</text>
  </g>

  <!-- Central VIP Membership Card -->
  <g filter="url(#card-shadow)">
    <rect x="65" y="85" width="190" height="118" rx="16" fill="url(#card-bg)" />
    
    <!-- Decorative Card Wave -->
    <path d="M65 140 C110 120 150 160 255 125 L255 203 L65 203 Z" fill="#005bb5" opacity="0.4" rx="16" />
    <path d="M65 160 C120 145 170 180 255 150 L255 203 L65 203 Z" fill="#0284c7" opacity="0.2" rx="16" />

    <!-- Card Chip -->
    <rect x="85" y="105" width="28" height="22" rx="4" fill="url(#gold-badge)" />
    <line x1="85" y1="116" x2="113" y2="116" stroke="#78350f" stroke-width="0.8" opacity="0.5" />
    <line x1="99" y1="105" x2="99" y2="127" stroke="#78350f" stroke-width="0.8" opacity="0.5" />

    <!-- Card Brand & Infinity Symbol -->
    <text x="235" y="115" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#93c5fd" text-anchor="end" letter-spacing="0.05em">INFINITY STORE</text>
    
    <g filter="url(#glow)">
      <text x="235" y="145" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="end">∞</text>
    </g>

    <!-- Card Tier Label -->
    <rect x="85" y="145" width="92" height="20" rx="10" fill="rgba(255, 255, 255, 0.18)" />
    <text x="131" y="159" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.08em">VIP MEMBER</text>

    <!-- Card Footer -->
    <text x="85" y="186" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#bae6fd" letter-spacing="0.12em">•••• 2026</text>
    <text x="235" y="186" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#e0f2fe" text-anchor="end">PREMIUM</text>
  </g>

  <!-- Floating Crown on Top of Card -->
  <g transform="translate(142, 66)" filter="url(#glow)">
    <path d="M4 22 L9 8 L18 16 L27 8 L32 22 Z" fill="url(#gold-badge)" />
    <circle cx="4" cy="22" r="2" fill="#fef08a" />
    <circle cx="9" cy="8" r="2.5" fill="#fef08a" />
    <circle cx="18" cy="16" r="2.5" fill="#fef08a" />
    <circle cx="27" cy="8" r="2.5" fill="#fef08a" />
    <circle cx="32" cy="22" r="2" fill="#fef08a" />
  </g>
</svg>